name: docs-management
version: "1.0"
description: >
  프로젝트 문서가 늘어날 때 docs/INDEX.md를 문서 라우팅용 단일 진입점으로 만들고,
  아키텍처, 정책, 구현 계획, 리뷰 문서의 우선순위와 상태를 관리한다.
  에이전트가 프로젝트 문서를 찾거나 정리하거나 새 문서를 추가할 때 사용한다.

prerequisites:
  - "프로젝트 루트에서 실행"
  - "docs/ 디렉터리 존재 또는 생성 권한"

policies: []

triggers:
  - "docs index"
  - "문서 index"
  - "문서 인덱스"
  - "문서 관리"
  - "docs 정리"
  - "문서 정리"
  - "문서 구조"
  - "source of truth"
  - "정본 문서"

adapters:
  claude: default
  codex: default
  agy: default
