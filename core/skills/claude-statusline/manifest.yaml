name: claude-statusline
version: "1.0"
description: >
  Claude Code 상태바(statusLine)를 커스터마이징한다.
  시간, 컨텍스트 사용률(%), 모델명, 토큰 수를 표시하는 Node.js 스크립트와
  settings.json 연동 방법을 제공한다.

prerequisites:
  - "Node.js 설치"
  - "~/.claude/settings.json 쓰기 권한"

policies: []

triggers:
  - "상태바"
  - "statusline"
  - "status line"
  - "상태줄"
  - "클로드 상태바"
  - "claude 상태바"
  - "컨텍스트 표시"
  - "토큰 표시"
  - "모델명 표시"

adapters:
  claude: default
  codex: default
  gemini: default
