name: codex-statusline
version: "1.0"
description: >
  Codex CLI의 하단 상태표시줄(status line)과 터미널 제목(terminal title)을
  config.toml로 설정한다. 사용 모델명, 컨텍스트 잔량, 작업 디렉터리 같은
  기본 항목을 표시하거나 상태줄 구성을 바꾸고 싶을 때 사용한다.

prerequisites:
  - "~/.codex/config.toml 또는 %USERPROFILE%\\.codex\\config.toml 쓰기 권한"
  - "Codex CLI 사용 환경"

policies: []

triggers:
  - "codex 상태표시줄"
  - "codex statusline"
  - "codex status line"
  - "상태표시줄 꾸며"
  - "상태표시줄 설정"
  - "상태줄 설정"
  - "컨텍스트 표시"
  - "모델명 표시"
  - "terminal title"

adapters:
  claude: default
  codex: default
  gemini: default
