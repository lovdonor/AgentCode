name: team-agent
version: "1.0"
description: >
  리더, 개발자, 리뷰어, 테스터로 역할을 분리한 멀티 에이전트 협업 워크플로우를
  구성하고 파일 기반 메시지 박스로 조율한다. 역할 터미널은 tmux 또는 Orca
  백엔드로 연다 (TEAM_AGENT_BACKEND 로 선택, 기본 자동 감지).

prerequisites:
  - "tmux 설치 또는 Orca 앱 실행 중 (프로젝트가 Orca 에 등록됨)"
  - "claude, codex, agy CLI 사용 가능"
  - "프로젝트 루트에서 스크립트 실행"

triggers:
  - "멀티 에이전트"
  - "team-agent"
  - "팀 개발"
  - "에이전트 협업"
  - "multi-agent"
  - "팀 작업"
  - "team collaboration"
  - "orca 팀"
  - "orca 멀티 에이전트"
  - "리더 개발 리뷰 테스트"

adapters:
  claude: override   # adapters/claude/overrides/team-agent.md 적용
  codex: override    # adapters/codex/overrides/team-agent.md 적용
  agy: override      # adapters/agy/overrides/team-agent.md 적용
