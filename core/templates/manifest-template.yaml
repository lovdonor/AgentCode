# manifest.yaml 템플릿
# 각 스킬 디렉터리(core/skills/<name>/)에 이 파일을 복사하여 사용한다.

name: skill-name-here
version: "1.0"
description: >
  이 스킬이 해결하는 문제와 대표 사용 맥락을 기술한다.

# 선행조건: 도구, 런타임, 실행 위치 등 스킬 사용 전에 충족해야 할 조건
prerequisites: []
  # - "Python 3.11+"
  # - "프로젝트 루트에서 실행"

# 이 스킬이 참조하는 정책 목록 (core/policies/ 아래 파일명, 확장자 제외)
policies: []
  # - coding-standards
  # - safety-rules

# 트리거 키워드: 사용자 요청에 아래 키워드가 포함되면 스킬 우선 검토
triggers: []
  # - "빌드 실패"
  # - "build error"

# 모델별 오버라이드 여부
# default: core/skills/<name>/skill.md 그대로 사용
# override: adapters/<model>/overrides/<name>.md 사용 (본문 보완)
adapters:
  claude: default
  codex: default
  agy: default
